name: C++ CI

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake libgtest-dev

    - name: Configure
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build
